name: Release

# Pousser une étiquette « vX.Y.Z » (identique à panther/__init__.py) publie une version GitHub avec le wheel et le .deb.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: L'étiquette doit correspondre à la version du code
        run: |
          VERSION=$(python -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('panther/__init__.py').read()).group(1))")
          test "v$VERSION" = "${GITHUB_REF_NAME}" || { echo "étiquette ${GITHUB_REF_NAME} != version $VERSION"; exit 1; }
      - name: Tests du moteur
        run: python -m unittest discover -s tests -t .
      - name: Wheel et .deb
        run: |
          python -m pip install build
          python -m build --wheel
          ./packaging/build-deb.sh
      - name: Notes de version (section du CHANGELOG)
        run: |
          V="${GITHUB_REF_NAME#v}"
          awk -v v="$V" '$0 ~ "^## \\["v"\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || echo "Voir CHANGELOG.md." > notes.md
      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "Panther ${GITHUB_REF_NAME#v}" --notes-file notes.md
