name: CI

on:
  push:
  pull_request:

jobs:
  moteur:
    name: Tests du moteur (Python ${{ matrix.python }}, sans Qt)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compilation
        run: python -m compileall -q panther
      - name: Tests (le moteur n'utilise que la bibliothèque standard)
        run: python -m unittest discover -s tests -t . -v

  interface:
    name: Tests de l'interface (PyQt6, hors écran)
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Bibliothèques système requises par Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - name: Installer PyQt6
        run: python -m pip install PyQt6
      - name: Tous les tests (moteur + interface + PDF)
        run: python -m unittest discover -s tests -t . -v

  paquets:
    name: Paquets (wheel et .deb)
    needs: [moteur, interface]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Wheel
        run: python -m pip install build && python -m build --wheel
      - name: .deb
        run: ./packaging/build-deb.sh
      - name: Vérifier le contenu du wheel
        run: python -m zipfile -l dist/*.whl | grep -E "panther/(oui.txt|static/index.html|assets/panther.svg)"
      - uses: actions/upload-artifact@v4
        with:
          name: paquets
          path: dist/*
